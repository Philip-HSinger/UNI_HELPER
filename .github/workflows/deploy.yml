name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+ needed: @supabase/supabase-js's realtime client requires a native WebSocket
          # global (added in Node 22) - on 20 it throws at createClient() time, failing `npm test`.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - name: Build (base path = /<repo-name>/)
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Set these in Settings -> Secrets and variables -> Actions. The anon key is meant to be
          # public (see src/lib/supabaseClient.ts) - access control is Row Level Security, not
          # secrecy of this key - but it's still a repo secret so it isn't hardcoded in the yml.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
