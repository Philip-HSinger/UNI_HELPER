[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unimath"
version = "0.1.0"
description = "Statistical admissions analytics terminal: calibrated chances, cross-admit Bayes, essay-reuse optimization"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
report = ["matplotlib>=3.8", "reportlab>=4.0"]
test = ["pytest>=8"]

[project.scripts]
unimath = "unimath.cli:main"

[tool.setuptools]
packages = ["unimath"]

[tool.setuptools.package-data]
unimath = []
